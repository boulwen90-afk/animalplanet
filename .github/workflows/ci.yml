name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Playwright's own image, with Chromium, Firefox and WebKit and the
    # system packages they need already in it. Installing them in the job
    # downloaded some 190 packages from Ubuntu's mirror, and when the mirror
    # was slow that alone took longer than the whole job may. The version
    # must be the one of @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    # The unit tests play whole matches, and the determinism test plays
    # several twice over: together with the browser tests that is about 13
    # minutes. The limit only has to catch a job that hangs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      # All tests run in Chromium. Firefox and WebKit run the determinism
      # tests only: two players may use different browsers, and every engine
      # must count the same. The browsers come with the image.
      - name: Browser tests
        run: npm run e2e
        env:
          E2E_ALL_BROWSERS: '1'
      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore

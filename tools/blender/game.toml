# Settings shared by every figure.

[sprite]
# The game's ground tile, in pixels (MAP_CONFIG in src/data/map.ts).
tile_width = 64
tile_height = 32
# The game looks down on the ground at 30 degrees: a square tile becomes twice as wide as high.
camera_elevation_deg = 30.0
# How many pixels one Blender unit is in the game. A bear is about 2.2 units tall.
pixels_per_unit = 22.0
# Size of one picture of a figure in the game, in pixels.
frame = 64
# The camera looks at this height on the figure, so the figure sits in the middle of the frame.
target_z = 1.2
# A dark edge around the figure, one pixel wide in the game.
outline = "#141a12"
outline_strength = 0.9
# Width of the renderer's pixel filter for game-size pictures. Lower is sharper.
filter_width = 1.0

[preview]
size = 512
view_width = 3.3        # Blender units across the large previews
samples = 96
background = "#5a8f3c"  # the game's grass, MapView.ts
ground_edge = "#3f6b2a"

[lighting]
sky = 0.7
key = 2.6
key_from = [-0.55, -0.6, 1.0]     # from the upper left, in front
fill = 0.9
fill_from = [0.9, -0.5, 0.35]
softness_deg = 10.0

# The same colours as PLAYER_COLORS in src/render/views/visuals.ts.
[teams]
blue = "#3b7de0"
red = "#d0453a"

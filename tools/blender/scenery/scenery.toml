# What stands on the ground between the buildings, and the ground's own
# water and shore. `build.py --scenery` renders it to assets/scenery/.
# Lengths are in tiles. Every item stands on the middle of its tile.
name = "scenery"

# How much of an item's shadow is kept: an ellipse round its foot, this many
# game pixels across and down from its middle, fading out over `soft` more.
[shadow_reach]
across = 22
down = 11
soft = 8

[colors]
bark = "#6b4423"
wood_cut = "#d9b77e"
needle = "#2c7438"
needle_dark = "#1f5c2a"
leaf = "#4c9a44"
leaf_dark = "#357a35"
berry = "#c8243a"
berry_light = "#ec5f72"
rock = "#8f9195"
rock_light = "#b0b2b0"
rock_dark = "#676a70"
cave_dark = "#15171a"
sand = "#d9c58b"
sand_dark = "#bda86f"
fish = "#8fb6cf"
smoke = "#5e5f63"
smoke_light = "#74757a"
smoke_dark = "#4b4c51"
flame = "#f08a1c"
flame_dark = "#d9541a"
flame_core = "#ffd95a"
iron = "#7d848c"
iron_light = "#b9c0c8"

# The ground: water, and the shore between water and land. Drawn, not rendered.
[ground]
water = "#2f6fb5"
water_light = "#4a8ccd"
water_shallow = "#5fa9cf"
foam = "#e8f3f6"
sand = "#d9c58b"
sand_wet = "#b89f68"
water_variants = 3

# The shore, in tiles from the waterline: how far out the water is shallow,
# how wide the line of foam is, how far up the sand is solid, and over what
# further distance it fades out over the grass.
[ground.shore]
shallow = 0.3
foam = 0.05
sand = 0.12
fade = 0.14

# --- Trees: three kinds, so that a forest does not look like one tree repeated.
[[item]]
name = "tree_1"
kind = "tree"
[[item.part]]
type = "conifer"
height = 1.9
radius = 0.4
tiers = 4

[[item]]
name = "tree_2"
kind = "tree"
[[item.part]]
type = "conifer"
height = 1.65
radius = 0.44
tiers = 3
lean = 0.05

[[item]]
name = "tree_3"
kind = "tree"
[[item.part]]
type = "broadleaf"
height = 1.6
radius = 0.5

# What a felled tree leaves behind.
[[item]]
name = "stump"
kind = "remains"
[[item.part]]
type = "stump"

# --- Berry bushes: full, picked at, and bare.
[[item]]
name = "bush_full"
kind = "bush"
[[item.part]]
type = "bush"
size = 0.5
berries = 10

[[item]]
name = "bush_few"
kind = "bush"
[[item.part]]
type = "bush"
size = 0.5
berries = 4

[[item]]
name = "bush_bare"
kind = "remains"
[[item.part]]
type = "bush"
size = 0.4
berries = 0


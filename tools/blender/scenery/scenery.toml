# --- The marks of a fishing place on the shore.
[[item]]
name = "fishing_place"
kind = "remains"
[[item.part]]
type = "fishing_place"

# --- Damage on a building: smoke and flames. The game puts them on the
# building, lets the smoke rise and fade, and flips through the flames. They
# cast no shadow of their own and have no outline: smoke is not a solid thing.
# Each clump of smoke is (x, y, z, radius).
[[item]]
name = "smoke_1"
kind = "effect"
shadow = false
outline = false
[[item.part]]
type = "smoke"
clumps = [[0.0, 0.0, 0.24, 0.24], [-0.17, 0.08, 0.36, 0.17], [0.16, -0.06, 0.4, 0.18]]

[[item]]
name = "smoke_2"
kind = "effect"
shadow = false
outline = false
[[item.part]]
type = "smoke"
turn = 1.3
clumps = [[0.0, 0.0, 0.26, 0.22], [0.18, 0.05, 0.24, 0.17], [-0.13, -0.08, 0.42, 0.19], [0.05, 0.12, 0.5, 0.13]]

[[item]]
name = "smoke_3"
kind = "effect"
shadow = false
outline = false
[[item.part]]
type = "smoke"
turn = 2.4
clumps = [[0.0, 0.0, 0.28, 0.25], [0.19, -0.07, 0.44, 0.16], [-0.16, 0.06, 0.4, 0.14]]


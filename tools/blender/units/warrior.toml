# The melee soldier: mail and plate, a sword and a round shield.
# In the game: "ramkrigare" for the bears.
name = "warrior"
game_unit = "ramkrigare"

[armor]
helmet = "nasal"       # an open helmet with a nose guard; the ears stay free
cuirass = true         # breastplate
mail = true            # mail shirt with skirt and sleeves
skirt_length = 0.24
sleeve_length = 0.3    # how far down the upper arm the mail reaches, 0..1
pauldrons = true
bracers = true
greaves = true
belt = true
tabard = true          # team colour, at the front
cape = true            # team colour, down the back
cape_length = 1.0

[weapon]
type = "sword"         # "sword" or "axe"
hand = "right"
length = 1.0
width = 0.17
direction = [-0.22, -0.30, 1.0]   # where the blade points
flat_axis = [1.0, 0.25, 0.0]      # the blade is wide along this direction

[shield]
type = "round"
arm = "left"
radius = 0.50
normal = [0.30, -1.0, 0.08]       # the way the face of the shield points

[colors]
steel = "#98a2ae"
steel_dark = "#5f6873"
blade = "#c3cbd4"
mail = "#4e555e"
brass = "#c8a048"
leather = "#5a3a22"
wood = "#7b5634"

# The static pose: which way each part of a limb points from its joint.
# The figure faces -Y; its right side is -X.
[pose]
upper_arm_r = [-0.45, -0.10, -1.0]
forearm_r = [-0.35, -0.80, 0.30]
upper_arm_l = [0.50, -0.30, -1.0]
forearm_l = [-0.30, -0.85, 0.25]
thigh_l = [0.10, -0.05, -1.0]
shin_l = [0.03, 0.08, -1.0]
thigh_r = [-0.10, -0.05, -1.0]
shin_r = [-0.03, 0.08, -1.0]

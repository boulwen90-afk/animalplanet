# The bears' palisade, the Palissad: sharpened stakes standing close on one
# tile, with a rail in the side's colour along them. It comes in three
# variants, and the game picks the one that fits what stands beside it:
# "x" for a piece in a row along the x axis, "y" for one in a row along the
# y axis, and "block" for a corner, a crossing or a piece standing alone: a
# square of stakes that the rows run into.
# Lengths are in tiles; see lib/structures.py for the frame.
name = "wall"
game_building = "palissad"
size_class = "wall"
footprint = 1
variants = ["x", "y", "block"]

# --- A piece in a row along x. First a few stakes, then every other, then all.
[[part]]
type = "palisade"
variant = "x"
start = [-0.5, 0.0]
end = [0.5, 0.0]
height = 0.5
radius = 0.07
gap = 3.4
from = "construction_1"
until = "construction_1"

[[part]]
type = "palisade"
variant = "x"
start = [-0.5, 0.0]
end = [0.5, 0.0]
height = 0.8
radius = 0.07
gap = 1.75
from = "construction_2"
until = "construction_2"

[[part]]
type = "palisade"
variant = "x"
start = [-0.5, 0.0]
end = [0.5, 0.0]
height = 0.8
radius = 0.07

# The rail, on the side the player sees.
[[part]]
type = "beam"
variant = "x"
start = [-0.5, -0.085, 0.5]
end = [0.5, -0.085, 0.5]
radius = 0.035
material = "team"

[[part]]
type = "beam"
variant = "x"
start = [-0.5, -0.08, 0.2]
end = [0.5, -0.08, 0.2]
radius = 0.03
material = "timber_dark"
from = "construction_2"


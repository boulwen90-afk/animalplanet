# The bears' fishing hut, the Fiskehytta: a low log hut on a plank deck, with
# fish hung to dry, a net and barrels for the catch. It stands by water, on
# any side of it, so nothing here points at the water.
# Lengths are in tiles; see lib/structures.py for the frame.
name = "fishery"
game_building = "fiskehytta"
size_class = "small"
footprint = 2

# A deck of planks on short stone footings, instead of a stone floor.
[[part]]
type = "base"
box = [-0.9, -0.9, 0.9, 0.9]
height = 0.06
corner = 0.1
from = "construction_1"

[[part]]
type = "slab"
box = [-0.86, -0.86, 0.86, 0.86]
z = [0.06, 0.12]
material = "timber_mid"
from = "construction_1"

[[part]]

# The bears' smithy, the Smedja: a log workshop under a slate roof with a
# heavy stone chimney, and in front of it an open lean-to where the hearth
# glows and the anvil stands, with weapons on a rack and a barrel to quench
# the iron in.
# Lengths are in tiles; see lib/structures.py for the frame.
name = "forge"
game_building = "smedja"
size_class = "small"
footprint = 2

# Fire in the hearth and in the window, and iron that has been worked bright.
[colors]
glow = "#ff9a3c"
glow_hot = "#ffe08a"
iron_bright = "#8d959e"

[[part]]
type = "base"
box = [-0.9, -0.9, 0.9, 0.9]
height = 0.1
corner = 0.12
from = "construction_1"

[[part]]
type = "frame"
box = [-0.7, -0.1, 0.62, 0.76]
z = [0.1, 0.85]
spacing = 0.66
thickness = 0.08
from = "construction_1"
until = "construction_1"

[[part]]
type = "planks"
at = [-0.3, -0.6]
z = 0.1
along = "x"
length = 0.5
from = "construction_1"
until = "construction_2"

[[part]]
type = "scaffold"
box = [-0.7, -0.1, 0.62, 0.76]
height = 0.95
out = 0.1
from = "construction_1"
until = "construction_2"

# The workshop itself stands at the back of the plot.
[[part]]
type = "walls"
box = [-0.7, -0.1, 0.62, 0.76]
z = [0.1, 0.85]
log = 0.115
ends = 0.05
from = "construction_2"

[[part]]
type = "rafters"
box = [-0.7, -0.1, 0.62, 0.76]
eave = 0.8
ridge = 1.45
along = "x"
overhang = 0.14
count = 5
from = "construction_2"
until = "construction_2"

[[part]]
type = "door"
face = "-y"
wall = -0.1
at = 0.3
z = 0.1
width = 0.32
height = 0.56
from = "construction_2"

[[part]]
type = "gable_roof"
box = [-0.7, -0.1, 0.62, 0.76]
eave = 0.8
ridge = 1.45
along = "x"
overhang = 0.14
courses = 4
thickness = 0.09
cap = "team"

# The chimney of the forge: broad, of stone, and taller than the roof.
[[part]]
type = "chimney"
at = [-0.5, 0.42]
z = [0.1, 1.85]
size = 0.36

[[part]]
type = "window"
face = "-y"
wall = -0.1
at = -0.3
z = 0.42
width = 0.24
height = 0.22

# The open lean-to in front of the hearth: two posts and a roof of planks,
# high enough to see the fire under it.
[[part]]
type = "beam"
start = [-0.82, -0.62, 0.1]
end = [-0.82, -0.62, 0.92]
radius = 0.045

[[part]]
type = "beam"
start = [-0.16, -0.62, 0.1]
end = [-0.16, -0.62, 0.92]
radius = 0.045

[[part]]
type = "slab"
box = [-0.88, -0.68, -0.1, -0.06]
z = [0.92, 0.98]
material = "timber_dark"

# Under it, the hearth against the wall, its mouth towards the yard.
[[part]]
type = "hearth"
at = [-0.5, -0.3]
z = 0.1
face = "-y"
width = 0.5
depth = 0.34
height = 0.52

# In the open yard: the anvil, weapons on a rack, and a barrel of water to
# quench the iron in.
[[part]]
type = "anvil"
at = [-0.48, -0.74]
z = 0.1
size = 0.24
face = "-y"

[[part]]
type = "rack"
at = [0.52, -0.5]
z = 0.1
face = "-y"
width = 0.5
height = 0.42

[[part]]
type = "barrel"
at = [-0.02, -0.74]
z = 0.1
radius = 0.11
height = 0.26

[[part]]
type = "pennant"
at = [0.62, -0.1]
z = 1.3
height = 0.4
face = "-y"

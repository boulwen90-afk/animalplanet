radius = 0.04

[[part]]
type = "beam"
start = [-0.4, 0.4, 1.9]
end = [-0.4, 0.4, 2.3]
radius = 0.04

[[part]]
type = "spire"
at = [0.0, 0.0]
half = 0.36
z = [2.3, 3.05]

[[part]]
type = "pennant"
at = [0.0, 0.0]
z = 2.98
height = 0.42
face = "+x"

# Whose tower it is: the race's sigil on the wall towards the viewer.
[[part]]

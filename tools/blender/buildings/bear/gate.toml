# The bears' gate, the Port: two heavy posts with a beam across them, and
# between them two leaves of planks with iron bands. Its own side walks
# through it. It comes in two variants: "x" stands in a wall that runs
# along the x axis, "y" in one that runs along the y axis.
# Lengths are in tiles; see lib/structures.py for the frame.
name = "gate"
game_building = "port"
size_class = "wall"
footprint = 1
variants = ["x", "y"]

# --- In a wall along x. First the posts, of fresh timber; then the beam; then the leaves.
[[part]]
type = "beam"
variant = "x"
start = [-0.42, 0.0, 0.0]
end = [-0.42, 0.0, 1.22]
radius = 0.09
sides = 6
material = "timber_new"
